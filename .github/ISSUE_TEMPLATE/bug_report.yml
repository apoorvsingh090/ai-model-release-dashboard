name: Bug Report
description: Report a bug in AI Model Release Dashboard
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Search existing issues first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug.
      placeholder: Steps, expected behaviour, actual behaviour.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: checkboxes
    id: area
    attributes:
      label: Area
      options:
        - label: 'wrong days-since / cadence math'
        - label: 'overdue flag logic'
        - label: 'staleness banner'
        - label: 'chart / leaderboard rendering'
        - label: 'data vintage content'
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Commands, URLs, input data, screenshots.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. commit SHA or "latest main"

